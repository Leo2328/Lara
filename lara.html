<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Lara</title>
<style>
:root{color-scheme:light dark;--bg:#f2f5f4;--surface:#fff;--ink:#16211f;--muted:#5d6b68;--accent:#0f766e;--on-accent:#fff;--bubble:#e1ebe8;--line:#d5dedb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--surface:#16201e;--ink:#e6efed;--muted:#92a39f;--accent:#2dd4bf;--on-accent:#06201c;--bubble:#1f2d2a;--line:#2a3a37}}
:root[data-theme="dark"]{--bg:#0e1514;--surface:#16201e;--ink:#e6efed;--muted:#92a39f;--accent:#2dd4bf;--on-accent:#06201c;--bubble:#1f2d2a;--line:#2a3a37}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
h1{margin:0;font-size:1.4rem;letter-spacing:.02em}
.sub{font:12px system-ui,sans-serif;color:var(--muted)}
button{font:600 14px system-ui,sans-serif;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 12px}
button.main{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.lara{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:4px}
.err{align-self:center;color:#b3261e;font:14px system-ui,sans-serif;text-align:center}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:28ch}
form{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface)}
textarea{flex:1;resize:none;max-height:120px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,serif}
#cfg{position:fixed;inset:0;background:var(--bg);padding:16px;overflow-y:auto;display:none;padding-top:calc(16px + env(safe-area-inset-top,0px))}
#cfg.open{display:block}
label{display:block;margin:14px 0 4px;font:600 14px system-ui,sans-serif}
input,#cfg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);color:var(--ink);font:15px system-ui,sans-serif}
.hint{font:13px system-ui,sans-serif;color:var(--muted);margin:4px 0 0}
.row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.mem{display:flex;gap:8px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;font:14px system-ui,sans-serif}
.mem button{padding:4px 8px}
</style>
</head>
<body>
<header>
  <div><h1>Lara</h1><div class="sub" id="status"></div></div>
  <button id="openCfg" type="button">Ajustes</button>
</header>
<div id="chat" aria-live="polite"></div>
<form id="f">
  <textarea id="t" rows="1" placeholder="Escribe a Lara" aria-label="Mensaje"></textarea>
  <button class="main" id="send" type="submit">Enviar</button>
</form>

<section id="cfg" aria-label="Ajustes">
  <h1>Ajustes</h1>
  <label for="key">Clave de Gemini</label>
  <input id="key" type="password" autocomplete="off" placeholder="Pega tu clave de aistudio.google.com">
  <p class="hint">Se guarda solo en este teléfono. No la compartas ni publiques esta página con la clave puesta.</p>
  <label for="model">Modelo</label>
  <input id="model" placeholder="gemini-flash-latest">
  <p class="hint">Si da error de modelo, prueba otro nombre de la lista de AI Studio.</p>
  <label for="sys">Personalidad de Lara</label>
  <textarea id="sys" rows="6"></textarea>
  <label>Memoria de Lara</label>
  <p class="hint">Lo que Lara recuerda de ti. Ella añade datos importantes sola; aquí puedes borrarlos o añadir otros.</p>
  <div id="mems"></div>
  <div class="row"><input id="newmem" placeholder="Ej: Me llamo Leo"><button id="addmem" type="button">Añadir</button></div>
  <div class="row">
    <button class="main" id="save" type="button">Guardar</button>
    <button id="close" type="button">Cerrar</button>
    <button id="clear" type="button">Borrar conversación</button>
  </div>
</section>

<script>
const DEFAULT_SYS="Eres Lara, una asistente personal que habla español de forma clara, cálida y honesta. Responde con precisión y brevedad. Si no sabes algo, dilo. Nunca inventes datos.";
const $=id=>document.getElementById(id);
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
};
let history=[];
try{history=JSON.parse(store.get("lara_hist","[]"))||[]}catch(e){history=[]}

let mems=[];
try{mems=JSON.parse(store.get("lara_mem","[]"))||[]}catch(e){mems=[]}
function saveMems(){store.set("lara_mem",JSON.stringify(mems))}
function addMem(t){
  t=(t||"").trim().slice(0,200);
  if(!t||mems.some(m=>m.toLowerCase()===t.toLowerCase())) return;
  mems.push(t); if(mems.length>50) mems.shift(); saveMems();
}
function renderMems(){
  const box=$("mems"); box.innerHTML="";
  if(!mems.length){const p=document.createElement("p");p.className="hint";p.textContent="Aún no recuerda nada.";box.appendChild(p)}
  mems.forEach((m,i)=>{
    const d=document.createElement("div");d.className="mem";
    const s=document.createElement("span");s.textContent=m;
    const b=document.createElement("button");b.type="button";b.textContent="Borrar";
    b.onclick=()=>{mems.splice(i,1);saveMems();renderMems()};
    d.append(s,b);box.appendChild(d);
  });
}
function buildSys(){
  let s=store.get("lara_sys",DEFAULT_SYS);
  if(mems.length) s+="\n\nLo que sabes del usuario:\n- "+mems.join("\n- ");
  s+="\n\nSi el usuario te cuenta un dato personal duradero (nombre, gustos, familia, metas, preferencias) o te pide que recuerdes algo, añade al FINAL de tu respuesta una línea con este formato: [[MEMORIA: dato breve]]. No lo hagas con datos pasajeros. Nunca menciones esta etiqueta.";
  return s;
}
async function tryFetch(url,opts){
  let res;
  for(let i=0;i<3;i++){
    res=await fetch(url,opts);
    if(res.status!==503&&res.status!==429) return res;
    await new Promise(r=>setTimeout(r,2000*(i+1)));
  }
  return res;
}
$("addmem").onclick=()=>{addMem($("newmem").value);$("newmem").value="";renderMems()};
function add(role,text){
  const chat=$("chat");
  const e=chat.querySelector(".empty"); if(e) e.remove();
  const d=document.createElement("div");
  d.className="msg "+(role==="user"?"me":role==="err"?"err":"lara");
  if(role==="err") d.className="err";
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
  return d;
}
function render(){
  $("chat").innerHTML="";
  if(!history.length){
    const d=document.createElement("div");
    d.className="empty";
    d.textContent="Hola, soy Lara. Escríbeme lo que quieras.";
    $("chat").appendChild(d);
  }
  history.forEach(m=>add(m.role==="user"?"user":"lara",m.parts[0].text));
  $("status").textContent=store.get("lara_key","")?"Lista":"Falta la clave en Ajustes";
}
function openCfg(){
  $("key").value=store.get("lara_key","");
  $("model").value=store.get("lara_model","gemini-flash-latest");
  $("sys").value=store.get("lara_sys",DEFAULT_SYS);
  $("cfg").classList.add("open");
  renderMems();
}
$("openCfg").onclick=openCfg;
$("close").onclick=()=>{$("cfg").classList.remove("open");render()};
$("save").onclick=()=>{
  store.set("lara_key",$("key").value.trim());
  store.set("lara_model",$("model").value.trim()||"gemini-flash-latest");
  store.set("lara_sys",$("sys").value.trim()||DEFAULT_SYS);
  $("cfg").classList.remove("open");render();
};
$("clear").onclick=()=>{
  if(confirm("¿Borrar toda la conversación?")){history=[];store.set("lara_hist","[]");$("cfg").classList.remove("open");render()}
};
$("t").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,120)+"px"});

$("f").onsubmit=async ev=>{
  ev.preventDefault();
  const text=$("t").value.trim();
  if(!text) return;
  const key=store.get("lara_key","");
  if(!key){add("err","Falta la clave. Ábrela en Ajustes.");return}
  $("t").value="";$("t").style.height="auto";
  history.push({role:"user",parts:[{text}]});
  add("user",text);
  const bubble=add("lara","…");
  $("send").disabled=true;
  try{
    const model=store.get("lara_model","gemini-flash-latest");
    const res=await tryFetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent",{
      method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":key},
      body:JSON.stringify({
        systemInstruction:{parts:[{text:buildSys()}]},
        contents:history.slice(-30)
      })
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error&&data.error.message?data.error.message:"Error "+res.status);
    const parts=data.candidates&&data.candidates[0]&&data.candidates[0].content&&data.candidates[0].content.parts;
    const reply=parts?parts.map(p=>p.text||"").join(""):"";
    if(!reply) throw new Error("Lara no devolvió respuesta. Intenta de nuevo.");
    let clean=reply.replace(/\[\[MEMORIA:\s*([^\]]+?)\]\]/g,(m,t)=>{addMem(t);return ""}).trim();
    if(!clean) clean="Anotado.";
    bubble.textContent=clean;
    history.push({role:"model",parts:[{text:clean}]});
    store.set("lara_hist",JSON.stringify(history.slice(-100)));
  }catch(err){
    bubble.remove();
    history.pop();
    add("err","No se pudo responder: "+err.message);
  }
  $("send").disabled=false;
  $("chat").scrollTop=$("chat").scrollHeight;
};
render();
</script>
</body>
</html>
