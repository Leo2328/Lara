name: Construir app Android de Lara

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Dirección de Lara (déjalo vacío para usar la de tu repositorio)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Restaurar la llave de firma (para actualizar sin desinstalar)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: lara-debug-keystore-v1

      - name: Crear el proyecto de la app
        env:
          INPUT_URL: ${{ github.event.inputs.url }}
        run: |
          set -e
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          if [ -n "$INPUT_URL" ]; then
            URL="$INPUT_URL"
          elif [ "${REPO,,}" = "$OWNER.github.io" ]; then
            URL="https://$OWNER.github.io/lara.html"
          else
            URL="https://$OWNER.github.io/$REPO/lara.html"
          fi
          echo "Lara se cargará desde: $URL"
          mkdir -p lara-app/www
          cd lara-app
          npm init -y > /dev/null
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          echo '<!doctype html><meta charset="utf-8"><title>Lara</title><p style="font-family:sans-serif;padding:24px">Abriendo Lara… Si no carga, revisa tu conexión.</p>' > www/index.html
          printf '{"appId":"com.lara.app","appName":"Lara","webDir":"www","server":{"url":"%s"}}\n' "$URL" > capacitor.config.json
          npx cap add android
          npx cap sync android

      - name: Compilar la app (APK)
        working-directory: lara-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: lara-apk
          path: lara-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
